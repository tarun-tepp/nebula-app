<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebula</title>
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      background: #ffffff;
      color: #1a1a2e;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 16px;
    }

    a {
      color: inherit;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
      }

      html,
      body {
        background: #0b1020;
        color: #e6e9f2;
      }

      a {
        color: #7AA2FF;
      }
    }
  </style>
</head>
<body>
  <h1>Nebula</h1>
  <p>Nebula is a personal AI chat app for iPhone, iPad and Mac, used only by its owner. It is not offered to the public.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</body>
</html>
